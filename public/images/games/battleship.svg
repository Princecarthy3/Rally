<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSea" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <linearGradient id="shipSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="glowRadar" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bgSea)" />

  <!-- Tactical Radar Circles -->
  <g transform="translate(250, 250)">
    <circle cx="0" cy="0" r="210" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3" />
    <circle cx="0" cy="0" r="150" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" />
    <circle cx="0" cy="0" r="90" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5" />
    <line x1="-220" y1="0" x2="220" y2="0" stroke="#38bdf8" stroke-width="2" opacity="0.4" />
    <line x1="0" y1="-220" x2="0" y2="220" stroke="#38bdf8" stroke-width="2" opacity="0.4" />

    <!-- Radar Sweep Line -->
    <polygon points="0,0 180,-120 210,-40" fill="#38bdf8" opacity="0.15" />
  </g>

  <!-- 3D Battleship Hull (Center) -->
  <g transform="translate(250, 240) rotate(-25)" filter="url(#glowRadar)">
    <!-- Main Hull -->
    <path d="M -160 0 L -120 -30 L 120 -30 L 170 0 L 120 30 L -120 30 Z" fill="url(#shipSteel)" stroke="#cbd5e1" stroke-width="3" />
    <!-- Deck Superstructure -->
    <rect x="-60" y="-18" width="120" height="36" rx="6" fill="#475569" stroke="#94a3b8" stroke-width="2" />
    <rect x="-20" y="-12" width="60" height="24" rx="4" fill="#64748b" />
    <!-- Gun Turrets -->
    <circle cx="-90" cy="0" r="14" fill="#1e293b" />
    <line x1="-90" y1="0" x2="-45" y2="0" stroke="#0f172a" stroke-width="6" />
    <circle cx="80" cy="0" r="14" fill="#1e293b" />
    <line x1="80" y1="0" x2="125" y2="0" stroke="#0f172a" stroke-width="6" />
  </g>

  <!-- Red Target Hit Splash (Top Right) -->
  <g transform="translate(360, 140)" filter="url(#glowRadar)">
    <circle cx="0" cy="0" r="38" fill="none" stroke="#ef4444" stroke-width="5" />
    <circle cx="0" cy="0" r="22" fill="none" stroke="#ef4444" stroke-width="3" />
    <circle cx="0" cy="0" r="12" fill="#ef4444" />
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#ef4444" stroke-width="3" />
    <line x1="0" y1="-50" x2="0" y2="50" stroke="#ef4444" stroke-width="3" />
    <text x="0" y="-58" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#ef4444" text-anchor="middle">DIRECT HIT!</text>
  </g>
</svg>
