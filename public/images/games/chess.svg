<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgChess" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0e17" />
      <stop offset="50%" stop-color="#1f1b2e" />
      <stop offset="100%" stop-color="#0d0914" />
    </linearGradient>
    <linearGradient id="goldPiece" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="silverPiece" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="boardDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="boardLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bgChess)" />

  <!-- Ambient light -->
  <circle cx="250" cy="220" r="190" fill="#818cf8" opacity="0.12" filter="url(#glowGold)" />

  <!-- 3D Perspective Chess Board -->
  <g transform="translate(250, 290) scale(1, 0.5) rotate(45)">
    <rect x="-180" y="-180" width="360" height="360" rx="16" fill="#000000" opacity="0.6" filter="url(#glowGold)" />
    <rect x="-170" y="-170" width="340" height="340" rx="12" fill="#1e1b4b" stroke="#818cf8" stroke-width="4" />

    <!-- Checkerboard pattern -->
    <rect x="-160" y="-160" width="80" height="80" fill="url(#boardDark)" />
    <rect x="-80" y="-160" width="80" height="80" fill="url(#boardLight)" />
    <rect x="0" y="-160" width="80" height="80" fill="url(#boardDark)" />
    <rect x="80" y="-160" width="80" height="80" fill="url(#boardLight)" />

    <rect x="-160" y="-80" width="80" height="80" fill="url(#boardLight)" />
    <rect x="-80" y="-80" width="80" height="80" fill="url(#boardDark)" />
    <rect x="0" y="-80" width="80" height="80" fill="url(#boardLight)" />
    <rect x="80" y="-80" width="80" height="80" fill="url(#boardDark)" />

    <rect x="-160" y="0" width="80" height="80" fill="url(#boardDark)" />
    <rect x="-80" y="0" width="80" height="80" fill="url(#boardLight)" />
    <rect x="0" y="0" width="80" height="80" fill="url(#boardDark)" />
    <rect x="80" y="0" width="80" height="80" fill="url(#boardLight)" />

    <rect x="-160" y="80" width="80" height="80" fill="url(#boardLight)" />
    <rect x="-80" y="80" width="80" height="80" fill="url(#boardDark)" />
    <rect x="0" y="80" width="80" height="80" fill="url(#boardLight)" />
    <rect x="80" y="80" width="80" height="80" fill="url(#boardDark)" />
  </g>

  <!-- 3D Gold King Piece -->
  <g transform="translate(250, 190)" filter="url(#glowGold)">
    <!-- Shadow -->
    <ellipse cx="0" cy="110" rx="45" ry="15" fill="#000" opacity="0.4" />

    <!-- Base -->
    <path d="M -45 100 L 45 100 Q 50 85 35 80 L -35 80 Q -50 85 -45 100 Z" fill="url(#goldPiece)" />
    <!-- Pedestal ring -->
    <path d="M -35 80 Q 0 75 35 80 L 30 65 Q 0 60 -30 65 Z" fill="url(#goldPiece)" />
    <!-- Body -->
    <path d="M -28 65 Q -40 20 -18 0 Q 0 -10 18 0 Q 40 20 28 65 Z" fill="url(#goldPiece)" />
    <!-- Crown Rim -->
    <ellipse cx="0" cy="-5" rx="26" ry="8" fill="#fef08a" />
    <path d="M -26 -5 Q -32 -30 -20 -40 Q 0 -25 20 -40 Q 32 -30 26 -5 Z" fill="url(#goldPiece)" />
    <!-- Cross on Top -->
    <rect x="-5" y="-62" width="10" height="24" rx="2" fill="#fef08a" />
    <rect x="-12" y="-55" width="24" height="8" rx="2" fill="#fef08a" />
  </g>

  <!-- Knight Piece (Left) -->
  <g transform="translate(140, 240) scale(0.75)">
    <path d="M -30 60 Q -40 0 0 -40 Q 30 -50 40 -10 Q 45 30 20 40 Q 10 50 30 60 Z" fill="url(#silverPiece)" />
    <circle cx="-5" cy="-20" r="4" fill="#0f172a" />
  </g>

  <!-- Rook Piece (Right) -->
  <g transform="translate(360, 250) scale(0.75)">
    <rect x="-25" y="40" width="50" height="20" rx="4" fill="url(#silverPiece)" />
    <path d="M -20 40 L -15 -20 L 15 -20 L 20 40 Z" fill="url(#silverPiece)" />
    <path d="M -25 -20 L -25 -40 L -15 -40 L -15 -30 L -5 -30 L -5 -40 L 5 -40 L 5 -30 L 15 -30 L 15 -40 L 25 -40 L 25 -20 Z" fill="url(#silverPiece)" />
  </g>
</svg>
