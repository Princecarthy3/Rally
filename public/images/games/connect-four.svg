<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgC4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="yellowDisc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="redDisc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="glowC4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bgC4)" />

  <!-- Connect 4 Vertical Board -->
  <g transform="translate(60, 100)">
    <!-- Main Blue Grid Board Plate -->
    <rect x="0" y="0" width="380" height="300" rx="20" fill="#2563eb" stroke="#60a5fa" stroke-width="6" filter="url(#glowC4)" />

    <!-- Discs Grid (4 rows x 5 columns demo) -->
    <!-- Column 1 -->
    <circle cx="50" cy="50" r="28" fill="#1e1b4b" />
    <circle cx="50" cy="120" r="28" fill="url(#yellowDisc)" />
    <circle cx="50" cy="190" r="28" fill="url(#redDisc)" />
    <circle cx="50" cy="250" r="28" fill="url(#yellowDisc)" />

    <!-- Column 2 -->
    <circle cx="120" cy="50" r="28" fill="#1e1b4b" />
    <circle cx="120" cy="120" r="28" fill="url(#redDisc)" />
    <circle cx="120" cy="190" r="28" fill="url(#yellowDisc)" />
    <circle cx="120" cy="250" r="28" fill="url(#redDisc)" />

    <!-- Column 3 -->
    <circle cx="190" cy="50" r="28" fill="#1e1b4b" />
    <circle cx="190" cy="120" r="28" fill="url(#yellowDisc)" />
    <circle cx="190" cy="190" r="28" fill="url(#yellowDisc)" />
    <circle cx="190" cy="250" r="28" fill="url(#redDisc)" />

    <!-- Column 4 -->
    <circle cx="260" cy="50" r="28" fill="url(#yellowDisc)" filter="url(#glowC4)" />
    <circle cx="260" cy="120" r="28" fill="url(#yellowDisc)" filter="url(#glowC4)" />
    <circle cx="260" cy="190" r="28" fill="url(#yellowDisc)" filter="url(#glowC4)" />
    <circle cx="260" cy="250" r="28" fill="url(#yellowDisc)" filter="url(#glowC4)" />

    <!-- Column 5 -->
    <circle cx="330" cy="50" r="28" fill="#1e1b4b" />
    <circle cx="330" cy="120" r="28" fill="#1e1b4b" />
    <circle cx="330" cy="190" r="28" fill="url(#redDisc)" />
    <circle cx="330" cy="250" r="28" fill="url(#redDisc)" />

    <!-- Yellow Vertical Connect 4 Glowing Beam -->
    <line x1="260" y1="30" x2="260" y2="270" stroke="#fef08a" stroke-width="8" stroke-linecap="round" filter="url(#glowC4)" />
  </g>

  <!-- Dropping Disc Animation Arrow at top -->
  <g transform="translate(320, 50)" filter="url(#glowC4)">
    <circle cx="0" cy="0" r="24" fill="url(#yellowDisc)" />
    <polygon points="0,35 -12,15 12,15" fill="#fef08a" />
  </g>
</svg>
