<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDots" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="boxBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="boxGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="boxPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bgDots)" />

  <circle cx="250" cy="250" r="180" fill="#4ade80" opacity="0.12" filter="url(#glowGreen)" />

  <!-- Grid Container -->
  <g transform="translate(100, 100)">
    <!-- Filled Boxes -->
    <rect x="10" y="10" width="130" height="130" rx="12" fill="url(#boxBlue)" opacity="0.85" filter="url(#glowGreen)" />
    <text x="75" y="85" font-family="system-ui, sans-serif" font-weight="900" font-size="36" fill="#ffffff" text-anchor="middle">P1</text>

    <rect x="160" y="10" width="130" height="130" rx="12" fill="url(#boxGreen)" opacity="0.85" filter="url(#glowGreen)" />
    <text x="225" y="85" font-family="system-ui, sans-serif" font-weight="900" font-size="36" fill="#ffffff" text-anchor="middle">P2</text>

    <rect x="10" y="160" width="130" height="130" rx="12" fill="url(#boxPink)" opacity="0.85" filter="url(#glowGreen)" />
    <text x="75" y="235" font-family="system-ui, sans-serif" font-weight="900" font-size="36" fill="#ffffff" text-anchor="middle">P1</text>

    <!-- Connected Lines (Glowing) -->
    <!-- Horizontal -->
    <line x1="10" y1="0" x2="140" y2="0" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" filter="url(#glowGreen)" />
    <line x1="160" y1="0" x2="290" y2="0" stroke="#4ade80" stroke-width="12" stroke-linecap="round" filter="url(#glowGreen)" />
    <line x1="10" y1="150" x2="140" y2="150" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" filter="url(#glowGreen)" />
    <line x1="160" y1="150" x2="290" y2="150" stroke="#f472b6" stroke-width="12" stroke-linecap="round" filter="url(#glowGreen)" />
    <line x1="10" y1="300" x2="140" y2="300" stroke="#f472b6" stroke-width="12" stroke-linecap="round" filter="url(#glowGreen)" />

    <!-- Vertical -->
    <line x1="0" y1="10" x2="0" y2="140" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" filter="url(#glowGreen)" />
    <line x1="150" y1="10" x2="150" y2="140" stroke="#4ade80" stroke-width="12" stroke-linecap="round" filter="url(#glowGreen)" />
    <line x1="300" y1="10" x2="300" y2="140" stroke="#4ade80" stroke-width="12" stroke-linecap="round" filter="url(#glowGreen)" />
    <line x1="0" y1="160" x2="0" y2="290" stroke="#f472b6" stroke-width="12" stroke-linecap="round" filter="url(#glowGreen)" />
    <line x1="150" y1="160" x2="150" y2="290" stroke="#f472b6" stroke-width="12" stroke-linecap="round" filter="url(#glowGreen)" />

    <!-- Grid Dots -->
    <circle cx="0" cy="0" r="14" fill="#ffffff" filter="url(#glowGreen)" />
    <circle cx="150" cy="0" r="14" fill="#ffffff" filter="url(#glowGreen)" />
    <circle cx="300" cy="0" r="14" fill="#ffffff" filter="url(#glowGreen)" />

    <circle cx="0" cy="150" r="14" fill="#ffffff" filter="url(#glowGreen)" />
    <circle cx="150" cy="150" r="14" fill="#ffffff" filter="url(#glowGreen)" />
    <circle cx="300" cy="150" r="14" fill="#ffffff" filter="url(#glowGreen)" />

    <circle cx="0" cy="300" r="14" fill="#ffffff" filter="url(#glowGreen)" />
    <circle cx="150" cy="300" r="14" fill="#ffffff" filter="url(#glowGreen)" />
    <circle cx="300" cy="300" r="14" fill="#ffffff" filter="url(#glowGreen)" />
  </g>
</svg>
