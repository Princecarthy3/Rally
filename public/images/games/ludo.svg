<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLudo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <filter id="glowLudo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bgLudo)" />

  <!-- Ludo Board Frame -->
  <g transform="translate(100, 100)" filter="url(#glowLudo)">
    <rect x="0" y="0" width="300" height="300" rx="16" fill="#ffffff" stroke="#1e293b" stroke-width="8" />

    <!-- Red Base (Top Left) -->
    <rect x="10" y="10" width="110" height="110" fill="#ef4444" rx="8" />
    <circle cx="40" cy="40" r="14" fill="#ffffff" />
    <circle cx="90" cy="40" r="14" fill="#ffffff" />
    <circle cx="40" cy="90" r="14" fill="#ffffff" />
    <circle cx="90" cy="90" r="14" fill="#ffffff" />

    <!-- Green Base (Top Right) -->
    <rect x="180" y="10" width="110" height="110" fill="#22c55e" rx="8" />
    <circle cx="210" cy="40" r="14" fill="#ffffff" />
    <circle cx="260" cy="40" r="14" fill="#ffffff" />
    <circle cx="210" cy="90" r="14" fill="#ffffff" />
    <circle cx="260" cy="90" r="14" fill="#ffffff" />

    <!-- Yellow Base (Bottom Left) -->
    <rect x="10" y="180" width="110" height="110" fill="#eab308" rx="8" />
    <circle cx="40" cy="210" r="14" fill="#ffffff" />
    <circle cx="90" cy="210" r="14" fill="#ffffff" />
    <circle cx="40" cy="260" r="14" fill="#ffffff" />
    <circle cx="90" cy="260" r="14" fill="#ffffff" />

    <!-- Blue Base (Bottom Right) -->
    <rect x="180" y="180" width="110" height="110" fill="#3b82f6" rx="8" />
    <circle cx="210" cy="210" r="14" fill="#ffffff" />
    <circle cx="260" cy="210" r="14" fill="#ffffff" />
    <circle cx="210" cy="260" r="14" fill="#ffffff" />
    <circle cx="260" cy="260" r="14" fill="#ffffff" />

    <!-- Center Victory Triangles -->
    <polygon points="120,120 180,120 150,150" fill="#ef4444" />
    <polygon points="180,120 180,180 150,150" fill="#22c55e" />
    <polygon points="180,180 120,180 150,150" fill="#3b82f6" />
    <polygon points="120,180 120,120 150,150" fill="#eab308" />

    <!-- 3D Red Pawn Token standing out -->
    <g transform="translate(150, 150)" filter="url(#glowLudo)">
      <ellipse cx="0" cy="18" rx="16" ry="8" fill="#000000" opacity="0.4" />
      <path d="M -12 16 L 12 16 Q 16 12 8 0 Q 14 -10 0 -22 Q -14 -10 -8 0 Q -16 12 -12 16 Z" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
      <circle cx="0" cy="-22" r="10" fill="#fca5a5" stroke="#ffffff" stroke-width="2" />
    </g>
  </g>

  <!-- Rolling 3D White Dice (Bottom Right) -->
  <g transform="translate(380, 360) rotate(15)" filter="url(#glowLudo)">
    <rect x="-35" y="-35" width="70" height="70" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" />
    <!-- Dots for 6 -->
    <circle cx="-18" cy="-18" r="6" fill="#0f172a" />
    <circle cx="18" cy="-18" r="6" fill="#0f172a" />
    <circle cx="-18" cy="0" r="6" fill="#0f172a" />
    <circle cx="18" cy="0" r="6" fill="#0f172a" />
    <circle cx="-18" cy="18" r="6" fill="#0f172a" />
    <circle cx="18" cy="18" r="6" fill="#0f172a" />
  </g>
</svg>
