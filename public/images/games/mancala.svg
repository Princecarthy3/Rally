<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMancala" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#292524" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="woodTexture" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854d0e" />
      <stop offset="50%" stop-color="#713f12" />
      <stop offset="100%" stop-color="#3f2305" />
    </linearGradient>
    <filter id="glowMancala" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bgMancala)" />

  <circle cx="250" cy="250" r="180" fill="#a16207" opacity="0.12" filter="url(#glowMancala)" />

  <!-- Wooden Mancala Board (3D Angle) -->
  <g transform="translate(250, 250) scale(1, 0.75) rotate(-15)" filter="url(#glowMancala)">
    <!-- Main Wooden Board base -->
    <rect x="-210" y="-100" width="420" height="200" rx="60" fill="url(#woodTexture)" stroke="#fde047" stroke-width="4" />

    <!-- Left Kalah Store -->
    <ellipse cx="-150" cy="0" rx="30" ry="60" fill="#291605" stroke="#a16207" stroke-width="3" />
    <!-- Colorful Gemstones in Store -->
    <circle cx="-160" cy="-20" r="10" fill="#ef4444" />
    <circle cx="-140" cy="-10" r="9" fill="#3b82f6" />
    <circle cx="-150" cy="15" r="11" fill="#22c55e" />
    <circle cx="-160" cy="30" r="9" fill="#eab308" />

    <!-- Right Kalah Store -->
    <ellipse cx="150" cy="0" rx="30" ry="60" fill="#291605" stroke="#a16207" stroke-width="3" />
    <circle cx="140" cy="-15" r="10" fill="#3b82f6" />
    <circle cx="160" cy="0" r="11" fill="#a855f7" />
    <circle cx="150" cy="25" r="9" fill="#ef4444" />

    <!-- Top Pits (6 Pits) -->
    <ellipse cx="-90" cy="-45" rx="22" ry="22" fill="#291605" stroke="#a16207" stroke-width="2" />
    <circle cx="-90" cy="-45" r="7" fill="#3b82f6" />
    <circle cx="-84" cy="-40" r="7" fill="#ef4444" />

    <ellipse cx="-36" cy="-45" rx="22" ry="22" fill="#291605" stroke="#a16207" stroke-width="2" />
    <circle cx="-36" cy="-45" r="7" fill="#22c55e" />

    <ellipse cx="18" cy="-45" rx="22" ry="22" fill="#291605" stroke="#a16207" stroke-width="2" />
    <circle cx="18" cy="-45" r="7" fill="#eab308" />

    <ellipse cx="72" cy="-45" rx="22" ry="22" fill="#291605" stroke="#a16207" stroke-width="2" />
    <circle cx="72" cy="-45" r="7" fill="#a855f7" />

    <!-- Bottom Pits (6 Pits) -->
    <ellipse cx="-90" cy="45" rx="22" ry="22" fill="#291605" stroke="#a16207" stroke-width="2" />
    <circle cx="-90" cy="45" r="7" fill="#eab308" />

    <ellipse cx="-36" cy="45" rx="22" ry="22" fill="#291605" stroke="#a16207" stroke-width="2" />
    <circle cx="-36" cy="45" r="7" fill="#ef4444" />

    <ellipse cx="18" cy="45" rx="22" ry="22" fill="#291605" stroke="#a16207" stroke-width="2" />
    <circle cx="18" cy="45" r="7" fill="#3b82f6" />

    <ellipse cx="72" cy="45" rx="22" ry="22" fill="#291605" stroke="#a16207" stroke-width="2" />
    <circle cx="72" cy="45" r="7" fill="#22c55e" />
  </g>
</svg>
