<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMemory" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <linearGradient id="cardFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="100%" stop-color="#ffedd5" />
    </linearGradient>
    <linearGradient id="cardBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bgMemory)" />

  <circle cx="250" cy="250" r="180" fill="#f97316" opacity="0.15" filter="url(#glowOrange)" />

  <!-- Pair of Flipped Matching Cards -->
  <!-- Card 1 (Left - Flipped Front) -->
  <g transform="translate(160, 230) rotate(-10)" filter="url(#glowOrange)">
    <rect x="-65" y="-95" width="130" height="190" rx="16" fill="url(#cardFront)" stroke="#fb923c" stroke-width="5" />
    <!-- Star Symbol inside Card 1 -->
    <path d="M 0 -45 L 12 -12 L 45 0 L 12 12 L 0 45 L -12 12 L -45 0 L -12 -12 Z" fill="#f59e0b" filter="url(#glowOrange)" />
    <circle cx="0" cy="0" r="14" fill="#fbbf24" />
    <text x="0" y="70" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#ea580c" text-anchor="middle">MATCH!</text>
  </g>

  <!-- Card 2 (Right - Flipped Front Matching) -->
  <g transform="translate(340, 230) rotate(10)" filter="url(#glowOrange)">
    <rect x="-65" y="-95" width="130" height="190" rx="16" fill="url(#cardFront)" stroke="#fb923c" stroke-width="5" />
    <!-- Star Symbol inside Card 2 -->
    <path d="M 0 -45 L 12 -12 L 45 0 L 12 12 L 0 45 L -12 12 L -45 0 L -12 -12 Z" fill="#f59e0b" filter="url(#glowOrange)" />
    <circle cx="0" cy="0" r="14" fill="#fbbf24" />
    <text x="0" y="70" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#ea580c" text-anchor="middle">MATCH!</text>
  </g>

  <!-- Background Unflipped Cards -->
  <!-- Card Back Left -->
  <g transform="translate(80, 140) rotate(-25)">
    <rect x="-40" y="-60" width="80" height="120" rx="10" fill="url(#cardBack)" stroke="#ffffff" stroke-width="3" />
    <circle cx="0" cy="0" r="15" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="4,4" />
  </g>

  <!-- Card Back Right -->
  <g transform="translate(420, 140) rotate(25)">
    <rect x="-40" y="-60" width="80" height="120" rx="10" fill="url(#cardBack)" stroke="#ffffff" stroke-width="3" />
    <circle cx="0" cy="0" r="15" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="4,4" />
  </g>

  <!-- Sparkle Connection Lightning -->
  <path d="M 210 210 Q 250 180 290 210" stroke="#f59e0b" stroke-width="6" fill="none" stroke-linecap="round" filter="url(#glowOrange)" />
  <polygon points="250,170 256,186 272,192 256,198 250,214 244,198 228,192 244,186" fill="#fef08a" />
</svg>
