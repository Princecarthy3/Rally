<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGolf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>
    <linearGradient id="grassGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <filter id="glowGolf" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bgGolf)" />

  <!-- Golf Green Fairway -->
  <path d="M 50 420 C 120 200, 380 450, 450 180 C 480 80, 300 50, 200 120 C 100 190, 20 300, 50 420 Z" fill="url(#grassGreen)" stroke="#4ade80" stroke-width="4" filter="url(#glowGolf)" />

  <!-- Golf Hole -->
  <g transform="translate(360, 160)">
    <ellipse cx="0" cy="0" rx="32" ry="16" fill="#0f172a" />
    <ellipse cx="0" cy="-2" rx="26" ry="12" fill="#020617" />
    <!-- Flag Pole -->
    <line x1="0" y1="0" x2="0" y2="-160" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" />
    <!-- Red Flag -->
    <path d="M 0 -160 L -70 -130 L 0 -100 Z" fill="#ef4444" filter="url(#glowGolf)" />
    <text x="-35" y="-123" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle">18</text>
  </g>

  <!-- Golf Ball with Motion Trail -->
  <!-- Motion dotted arc -->
  <path d="M 120 380 Q 220 320 340 180" stroke="#fef08a" stroke-width="6" stroke-dasharray="8,8" fill="none" filter="url(#glowGolf)" />

  <!-- White Dimpled Golf Ball -->
  <g transform="translate(140, 370)" filter="url(#glowGolf)">
    <circle cx="0" cy="0" r="28" fill="#ffffff" />
    <!-- Dimples -->
    <circle cx="-10" cy="-10" r="3" fill="#cbd5e1" />
    <circle cx="6" cy="-12" r="3" fill="#cbd5e1" />
    <circle cx="-12" cy="6" r="3" fill="#cbd5e1" />
    <circle cx="8" cy="8" r="3" fill="#cbd5e1" />
    <circle cx="0" cy="0" r="3" fill="#cbd5e1" />
  </g>

  <!-- Aiming Power Meter Arrow -->
  <g transform="translate(190, 330) rotate(-40)">
    <polygon points="0,-30 15,10 0,0 -15,10" fill="#22c55e" filter="url(#glowGolf)" />
  </g>
</svg>
