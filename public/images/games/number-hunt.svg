<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgNumber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="tileActive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="tileGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bgNumber)" />

  <circle cx="250" cy="250" r="170" fill="#38bdf8" opacity="0.12" filter="url(#glowBlue)" />

  <!-- Grid of 5x5 Tiles -->
  <g transform="translate(85, 85)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="60" height="60" rx="10" fill="#334155" />
    <text x="30" y="38" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#94a3b8" text-anchor="middle">04</text>

    <rect x="68" y="0" width="60" height="60" rx="10" fill="#334155" />
    <text x="98" y="38" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#94a3b8" text-anchor="middle">19</text>

    <rect x="136" y="0" width="60" height="60" rx="10" fill="url(#tileActive)" filter="url(#glowBlue)" />
    <text x="166" y="38" font-family="system-ui, sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle">07</text>

    <rect x="204" y="0" width="60" height="60" rx="10" fill="#334155" />
    <text x="234" y="38" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#94a3b8" text-anchor="middle">12</text>

    <rect x="272" y="0" width="60" height="60" rx="10" fill="#334155" />
    <text x="302" y="38" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#94a3b8" text-anchor="middle">23</text>

    <!-- Row 2 -->
    <rect x="0" y="68" width="60" height="60" rx="10" fill="#334155" />
    <text x="30" y="106" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#94a3b8" text-anchor="middle">15</text>

    <rect x="68" y="68" width="60" height="60" rx="10" fill="#334155" />
    <text x="98" y="106" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#94a3b8" text-anchor="middle">02</text>

    <rect x="136" y="68" width="60" height="60" rx="10" fill="#334155" />
    <text x="166" y="106" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#94a3b8" text-anchor="middle">21</text>

    <rect x="204" y="68" width="60" height="60" rx="10" fill="url(#tileGold)" filter="url(#glowBlue)" />
    <text x="234" y="106" font-family="system-ui, sans-serif" font-weight="900" font-size="26" fill="#ffffff" text-anchor="middle">14</text>

    <rect x="272" y="68" width="60" height="60" rx="10" fill="#334155" />
    <text x="302" y="106" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#94a3b8" text-anchor="middle">09</text>

    <!-- Center Gold Target Row 3 -->
    <rect x="136" y="136" width="60" height="60" rx="10" fill="url(#tileActive)" filter="url(#glowBlue)" />
    <text x="166" y="174" font-family="system-ui, sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle">18</text>

    <!-- Row 4 & 5 Faded background tiles -->
    <rect x="0" y="204" width="60" height="60" rx="10" fill="#334155" />
    <rect x="68" y="204" width="60" height="60" rx="10" fill="#334155" />
    <rect x="136" y="204" width="60" height="60" rx="10" fill="#334155" />
    <rect x="204" y="204" width="60" height="60" rx="10" fill="#334155" />
    <rect x="272" y="204" width="60" height="60" rx="10" fill="#334155" />

    <rect x="0" y="272" width="60" height="60" rx="10" fill="#334155" />
    <rect x="68" y="272" width="60" height="60" rx="10" fill="#334155" />
    <rect x="136" y="272" width="60" height="60" rx="10" fill="#334155" />
    <rect x="204" y="272" width="60" height="60" rx="10" fill="#334155" />
    <rect x="272" y="272" width="60" height="60" rx="10" fill="#334155" />
  </g>

  <!-- Giant Magnifying Glass Crosshair Target -->
  <g transform="translate(320, 190)" filter="url(#glowBlue)">
    <circle cx="0" cy="0" r="55" fill="none" stroke="#fbbf24" stroke-width="8" />
    <circle cx="0" cy="0" r="35" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6,6" />
    <line x1="-70" y1="0" x2="70" y2="0" stroke="#fbbf24" stroke-width="3" />
    <line x1="0" y1="-70" x2="0" y2="70" stroke="#fbbf24" stroke-width="3" />
  </g>

  <!-- Floating +100 PTS Score Badge -->
  <g transform="translate(250, 420)" filter="url(#glowBlue)">
    <rect x="-80" y="-22" width="160" height="44" rx="22" fill="#38bdf8" />
    <text x="0" y="8" font-family="system-ui, sans-serif" font-weight="900" font-size="20" fill="#0f172a" text-anchor="middle" letter-spacing="1">+100 PTS!</text>
  </g>
</svg>
