<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRps" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311042" />
      <stop offset="50%" stop-color="#180b2b" />
      <stop offset="100%" stop-color="#090514" />
    </linearGradient>
    <linearGradient id="rockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="scissorsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <filter id="glowClash" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bgRps)" />

  <!-- Center Clash Energy Star -->
  <circle cx="250" cy="250" r="160" fill="#a855f7" opacity="0.15" filter="url(#glowClash)" />

  <!-- ROCK (Fist - Top Left) -->
  <g transform="translate(160, 160)" filter="url(#glowClash)">
    <circle cx="0" cy="0" r="70" fill="url(#rockGrad)" />
    <!-- Rock Fist Glyph -->
    <path d="M -25 -15 Q -25 -30 -10 -30 Q 0 -30 0 -15 L 0 20 Q 0 35 -15 35 Q -30 35 -30 20 Z" fill="#ffffff" />
    <path d="M -10 -25 Q 5 -25 5 -10 L 5 20" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 5 -20 Q 20 -20 20 -5 L 20 20" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 20 -15 Q 32 -15 32 0 L 32 20 Q 32 35 15 35" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" />
    <text x="0" y="55" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">ROCK</text>
  </g>

  <!-- PAPER (Hand - Top Right) -->
  <g transform="translate(340, 160)" filter="url(#glowClash)">
    <circle cx="0" cy="0" r="70" fill="url(#paperGrad)" />
    <!-- Paper Hand Glyph -->
    <path d="M -28 10 L -28 -25 Q -28 -35 -18 -35 Q -8 -35 -8 -25 L -8 10" stroke="#ffffff" stroke-width="6" fill="#ffffff" stroke-linecap="round" />
    <path d="M -8 10 L -8 -35 Q -8 -45 2 -45 Q 12 -45 12 -35 L 12 10" stroke="#ffffff" stroke-width="6" fill="#ffffff" stroke-linecap="round" />
    <path d="M 12 10 L 12 -30 Q 12 -40 22 -40 Q 32 -40 32 -30 L 32 10" stroke="#ffffff" stroke-width="6" fill="#ffffff" stroke-linecap="round" />
    <text x="0" y="55" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">PAPER</text>
  </g>

  <!-- SCISSORS (Fingers - Bottom Center) -->
  <g transform="translate(250, 340)" filter="url(#glowClash)">
    <circle cx="0" cy="0" r="75" fill="url(#scissorsGrad)" />
    <!-- Scissors Glyph -->
    <circle cx="-20" cy="25" r="14" fill="none" stroke="#ffffff" stroke-width="6" />
    <circle cx="20" cy="25" r="14" fill="none" stroke="#ffffff" stroke-width="6" />
    <line x1="-12" y1="15" x2="25" y2="-30" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
    <line x1="12" y1="15" x2="-25" y2="-30" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
    <circle cx="0" cy="5" r="5" fill="#ffffff" />
    <text x="0" y="58" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">SCISSORS</text>
  </g>

  <!-- Clash Sparks in Center -->
  <path d="M 250 200 L 255 240 L 290 245 L 260 255 L 265 290 L 245 260 L 210 265 L 235 245 Z" fill="#fef08a" filter="url(#glowClash)" />
</svg>
