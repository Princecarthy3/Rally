<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#311042" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gridGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="cellActive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="cellGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bg)" />

  <!-- Dynamic background grid pattern -->
  <path d="M 0 50 L 500 50 M 0 100 L 500 100 M 0 150 L 500 150 M 0 200 L 500 200 M 0 250 L 500 250 M 0 300 L 500 300 M 0 350 L 500 350 M 0 400 L 500 400 M 0 450 L 500 450" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
  <path d="M 50 0 L 50 500 M 100 0 L 100 500 M 150 0 L 150 500 M 200 0 L 200 500 M 250 0 L 250 500 M 300 0 L 300 500 M 350 0 L 350 500 M 400 0 L 400 500 M 450 0 L 450 500" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />

  <!-- Glowing background light circle -->
  <circle cx="250" cy="250" r="180" fill="#8b5cf6" opacity="0.15" filter="url(#glow)" />

  <!-- Isometric 3D Sudoku Main Grid Container -->
  <g transform="translate(250, 240) scale(1, 0.75) rotate(45)">
    <!-- Base Board Shadow -->
    <rect x="-170" y="-170" width="340" height="340" rx="24" fill="#000000" opacity="0.5" filter="url(#glow)" />
    <!-- Outer Frame -->
    <rect x="-165" y="-165" width="330" height="330" rx="20" fill="#1e1b4b" stroke="url(#gridGlow)" stroke-width="6" />

    <!-- 3x3 Subgrid outlines -->
    <rect x="-155" y="-155" width="310" height="310" rx="12" fill="none" stroke="#a78bfa" stroke-width="4" />
    <line x1="-51" y1="-155" x2="-51" y2="155" stroke="#a78bfa" stroke-width="4" />
    <line x1="51" y1="-155" x2="51" y2="155" stroke="#a78bfa" stroke-width="4" />
    <line x1="-155" y1="-51" x2="155" y2="-51" stroke="#a78bfa" stroke-width="4" />
    <line x1="-155" y1="51" x2="155" y2="51" stroke="#a78bfa" stroke-width="4" />

    <!-- Highlighted Active Cells -->
    <rect x="-150" y="-150" width="95" height="95" rx="8" fill="url(#cellActive)" opacity="0.8" />
    <rect x="-46" y="-46" width="92" height="92" rx="8" fill="url(#cellGold)" filter="url(#glow)" />
    <rect x="56" y="56" width="95" height="95" rx="8" fill="url(#cellActive)" opacity="0.7" />
  </g>

  <!-- Number Floating Elements (Un-rotated for clear readability) -->
  <!-- Floating Number 9 -->
  <g transform="translate(250, 230)" filter="url(#glow)">
    <circle cx="0" cy="0" r="45" fill="#f59e0b" />
    <text x="0" y="16" font-family="system-ui, sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle">9</text>
  </g>

  <!-- Floating Number 7 -->
  <g transform="translate(130, 160)">
    <circle cx="0" cy="0" r="32" fill="#3b82f6" />
    <text x="0" y="11" font-family="system-ui, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle">7</text>
  </g>

  <!-- Floating Number 4 -->
  <g transform="translate(370, 170)">
    <circle cx="0" cy="0" r="30" fill="#ec4899" />
    <text x="0" y="10" font-family="system-ui, sans-serif" font-weight="900" font-size="32" fill="#ffffff" text-anchor="middle">4</text>
  </g>

  <!-- Floating Number 5 -->
  <g transform="translate(140, 340)">
    <circle cx="0" cy="0" r="28" fill="#8b5cf6" />
    <text x="0" y="10" font-family="system-ui, sans-serif" font-weight="900" font-size="30" fill="#ffffff" text-anchor="middle">5</text>
  </g>

  <!-- Floating Number 3 -->
  <g transform="translate(360, 330)">
    <circle cx="0" cy="0" r="34" fill="#10b981" />
    <text x="0" y="12" font-family="system-ui, sans-serif" font-weight="900" font-size="36" fill="#ffffff" text-anchor="middle">3</text>
  </g>

  <!-- Speed timer arc indicator -->
  <path d="M 200 80 A 170 170 0 0 1 300 80" stroke="#f59e0b" stroke-width="6" fill="none" stroke-linecap="round" filter="url(#glow)" />
  <circle cx="250" cy="70" r="16" fill="#1e1b4b" stroke="#f59e0b" stroke-width="3" />
  <path d="M 250 63 L 250 70 L 254 74" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

  <!-- Battle VS spark badge -->
  <g transform="translate(250, 410)">
    <rect x="-60" y="-20" width="120" height="40" rx="20" fill="#0f172a" stroke="#ec4899" stroke-width="3" filter="url(#glow)" />
    <text x="0" y="6" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="2">VS BATTLE</text>
  </g>
</svg>
