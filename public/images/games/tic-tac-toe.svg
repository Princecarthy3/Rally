<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTtt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b2b" />
      <stop offset="50%" stop-color="#2d124d" />
      <stop offset="100%" stop-color="#0f071a" />
    </linearGradient>
    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bgTtt)" />

  <circle cx="250" cy="250" r="180" fill="#ec4899" opacity="0.12" filter="url(#glowPink)" />

  <!-- 3x3 Grid Lines -->
  <g transform="translate(100, 100)">
    <line x1="100" y1="10" x2="100" y2="290" stroke="#a78bfa" stroke-width="10" stroke-linecap="round" filter="url(#glowPink)" />
    <line x1="200" y1="10" x2="200" y2="290" stroke="#a78bfa" stroke-width="10" stroke-linecap="round" filter="url(#glowPink)" />
    <line x1="10" y1="100" x2="290" y2="100" stroke="#a78bfa" stroke-width="10" stroke-linecap="round" filter="url(#glowPink)" />
    <line x1="10" y1="200" x2="290" y2="200" stroke="#a78bfa" stroke-width="10" stroke-linecap="round" filter="url(#glowPink)" />

    <!-- X in Cell (1,1) -->
    <g transform="translate(50, 50)" filter="url(#glowPink)">
      <line x1="-30" y1="-30" x2="30" y2="30" stroke="#f43f5e" stroke-width="14" stroke-linecap="round" />
      <line x1="30" y1="-30" x2="-30" y2="30" stroke="#f43f5e" stroke-width="14" stroke-linecap="round" />
    </g>

    <!-- O in Cell (1,2) -->
    <g transform="translate(150, 50)" filter="url(#glowCyan)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#06b6d4" stroke-width="14" />
    </g>

    <!-- X in Cell (2,2) -->
    <g transform="translate(150, 150)" filter="url(#glowPink)">
      <line x1="-30" y1="-30" x2="30" y2="30" stroke="#f43f5e" stroke-width="14" stroke-linecap="round" />
      <line x1="30" y1="-30" x2="-30" y2="30" stroke="#f43f5e" stroke-width="14" stroke-linecap="round" />
    </g>

    <!-- O in Cell (3,1) -->
    <g transform="translate(50, 250)" filter="url(#glowCyan)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#06b6d4" stroke-width="14" />
    </g>

    <!-- X in Cell (3,3) - Winning 3-in-a-row -->
    <g transform="translate(250, 250)" filter="url(#glowPink)">
      <line x1="-30" y1="-30" x2="30" y2="30" stroke="#f43f5e" stroke-width="14" stroke-linecap="round" />
      <line x1="30" y1="-30" x2="-30" y2="30" stroke="#f43f5e" stroke-width="14" stroke-linecap="round" />
    </g>

    <!-- Diagonal Winning Laser Line -->
    <line x1="20" y1="20" x2="280" y2="280" stroke="#fef08a" stroke-width="12" stroke-linecap="round" filter="url(#glowPink)" />
  </g>
</svg>
